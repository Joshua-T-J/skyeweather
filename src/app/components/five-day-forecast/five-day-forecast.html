<div>
    <section class="forecast-list">
        @for (day of dailyForecasts(); track $index; let i=$index) {
        <div class="forecast-row" [style.animation-delay]="(i * 80) + 'ms'">
            <span class="forecast-day">{{ i === 0 ? 'Today' : day.dayName }}</span>
            <img [src]="getWeatherIcon(day.icon)" [alt]="day.description" class="forecast-icon" />
            <span class="forecast-desc">{{ day.description | titlecase }}</span>
            <div class="forecast-temps">
                <span class="forecast-max">{{ getDailyTemp(day.tempMax) }}°</span>
                <div class="temp-bar-wrap">
                    <div class="temp-bar-bg">
                        <div class="temp-bar-fill"></div>
                    </div>
                </div>
                <span class="forecast-min">{{ getDailyTemp(day.tempMin) }}°</span>
            </div>
        </div>
        }
    </section>
</div>
